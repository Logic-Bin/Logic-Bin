name: GitHub Trophies

on:
  schedule:
    - cron: "10 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/trophy.yml"

jobs:
  trophy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=tokyonight&column=4&row=2&margin-w=10&margin-h=10&no-frame=true&no-bg=true"
          path: .github/assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/assets/trophy.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub trophies [skip ci]"
            git push
          fi
