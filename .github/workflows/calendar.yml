name: Contribution Calendar

on:
  schedule:
    - cron: "5 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/calendar.yml"

jobs:
  calendar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Logic-Bin
          filename: contribution-calendar.svg

          base: ""
          config_timezone: Asia/Shanghai
          plugins_errors_fatal: yes

          plugin_calendar: yes
          plugin_calendar_limit: 1
